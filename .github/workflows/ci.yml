name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-scan:
    name: Lint, format check, and security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black bandit pyyaml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (flake8)
        run: flake8 modules ptaf tests --max-line-length=100 --extend-ignore=E203 || true

      - name: Format check (black)
        run: black --check -l 100 ptaf tests || true

      - name: Security scan (bandit)
        run: bandit -r modules ptaf -ll

      - name: Validate Sigma / YAML rule syntax
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          failed = False
          for path in pathlib.Path("modules/defensive/detection_rules").rglob("*.yml"):
              try:
                  yaml.safe_load(path.read_text())
                  print(f"OK: {path}")
              except Exception as exc:
                  print(f"FAILED to parse {path}: {exc}")
                  failed = True
          if failed:
              sys.exit(1)
          PY

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -v

      - name: Sentinel self-test (real canaries on this runner)
        shell: bash
        run: python -m ptaf selftest
