title: Shell History Disabled (linux)
id: 6c1a0576-d723-5f32-9403-cf6166deec2c
status: experimental
description: >
  Detects a shell command line that disables history logging, a common anti-forensics step. Maps to T1070.003.
references:
  - https://attack.mitre.org/techniques/T1070/003/
author: PTAF (example rule, adapt before production use)
date: 2026/10/31
logsource:
  category: process_creation
  product: linux
detection:
  selection_shell:
    Image|endswith:
        - '/sh'
        - '/bash'
        - '/zsh'
        - '/dash'
  selection_history:
    CommandLine|contains:
      - 'HISTFILE=/dev/null'
      - 'unset HISTFILE'
      - 'HISTSIZE=0'
      - 'history -c'
  condition: selection_shell and selection_history
falsepositives:
  - Privacy-minded admins and some CI images disable history on purpose.
level: medium
tags:
  - attack.defense_evasion
  - attack.t1070.003
