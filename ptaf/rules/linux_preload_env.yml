title: Dynamic Linker Preload Variable on Command (linux)
id: ff6972f3-a8d1-5b72-bac8-fe80a2824c02
status: experimental
description: >
  Detects LD_PRELOAD set on a command line, used for library injection and hooking. Maps to T1574.006.
references:
  - https://attack.mitre.org/techniques/T1574/006/
author: PTAF (example rule, adapt before production use)
date: 2026/10/31
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains: 'LD_PRELOAD='
  condition: selection
falsepositives:
  - Profilers, sanitizers and some debugging tools set this legitimately.
level: high
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.defense_evasion
  - attack.t1574.006
